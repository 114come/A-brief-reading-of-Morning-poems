version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: lowcode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lowcode_master
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: lowcode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lowcode-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MASTER_DB_HOST=mysql
      - MASTER_DB_PORT=3306
      - MASTER_DB_USER=root
      - MASTER_DB_PASSWORD=root
      - MASTER_DB_NAME=lowcode_master
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=dev-secret-key-change-in-production
      - APP_ENV=development
    depends_on:
      - mysql
      - redis
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
  redis_data:
