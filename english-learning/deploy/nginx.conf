# 朝词浅阅 - Nginx 生产配置
# 前端静态托管 + /api 反向代理到后端
#
# 适用：
#   - 前端构建产物: english-learning/dist
#   - 后端: uvicorn 监听 127.0.0.1:8001
#   - 前端端口: 80（如需改端口，改下面 listen 和 server_name）

server {
    listen 80;
    server_name localhost;

    # 前端静态文件（vue build 产物）
    root E:/20260718/english-learning/dist;
    index index.html;

    # 前端路由 history 模式：所有非 /api 路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
